<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 转换工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            min-height: 600px;
        }
        
        .editor-section, .preview-section {
            flex: 1;
            min-width: 300px;
            padding: 25px;
            border-right: 1px solid #eee;
        }
        
        .preview-section {
            background: #f9f9f9;
            border-right: none;
        }
        
        h2 {
            margin-bottom: 15px;
            color: #4b6cb7;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }
        
        h2 i {
            margin-right: 10px;
            font-size: 1.3rem;
        }
        
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            resize: vertical;
            background: #fdfdfd;
            transition: border 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4b6cb7;
            box-shadow: 0 0 0 2px rgba(75, 108, 183, 0.2);
        }
        
        #preview {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            line-height: 1.6;
        }
        
        #preview h1, #preview h2, #preview h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #182848;
        }
        
        #preview h1 {
            border-bottom: 2px solid #4b6cb7;
            padding-bottom: 5px;
        }
        
        #preview h2 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 3px;
        }
        
        #preview blockquote {
            border-left: 4px solid #4b6cb7;
            padding-left: 15px;
            margin: 15px 0;
            color: #666;
            background: #f5f5f5;
            padding: 10px 15px;
            border-radius: 0 5px 5px 0;
        }
        
        #preview code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d63384;
        }
        
        #preview pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            line-height: 1.4;
        }
        
        #preview pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        
        #preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        
        #preview table th, #preview table td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        
        #preview table th {
            background: #4b6cb7;
            color: white;
        }
        
        #preview table tr:nth-child(even) {
            background: #f9f9f9;
        }
        
        #preview img {
            max-width: 100%;
            border-radius: 5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #4b6cb7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button:hover {
            background: #3a5999;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        button i {
            margin-right: 8px;
        }
        
        .clear-btn {
            background: #e74c3c;
        }
        
        .clear-btn:hover {
            background: #c0392b;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .editor-section, .preview-section {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@17.0.1/lib/marked.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Markdown 转换工具</h1>
            <p class="subtitle">实时预览 | 代码高亮 | 响应式设计</p>
        </header>
        
        <div class="content">
            <div class="editor-section">
                <h2><i>📝</i> Markdown 编辑器</h2>
                <textarea id="editor" placeholder="在此输入 Markdown 内容...">
# Markdown 示例

这是一个 **Markdown 转换工具** 的示例。

## 功能特性
- 实时预览
- 代码高亮
- 响应式设计
- 多种样式支持

### 代码示例
javascript
function helloWorld() {
console.log("Hello, Markdown!");
return true;
}
### 表格示例
| 功能 | 状态 | 说明 |
|------|------|------|
| 实时预览 | ✅ 已实现 | 输入时自动更新 |
| 代码高亮 | ✅ 已实现 | 支持多种语言 |
| 导出HTML | 🔄 计划中 | 即将推出 |

> 提示：在左侧编辑内容，右侧将实时显示预览效果。</textarea>
            </div>
            
            <div class="preview-section">
                <h2><i>👁️</i> 预览效果</h2>
                <div id="preview"></div>
            </div>
        </div>
        
        <div class="controls">
            <button id="convert-btn"><i>🔄</i> 转换 Markdown</button>
            <button id="clear-btn" class="clear-btn"><i>🗑️</i> 清空内容</button>
        </div>
        
        <footer>
            <p>© 2025 Markdown 转换工具 | 基于 marked.js 构建</p>
        </footer>
    </div>

    <script>
        // 添加 marked.js 库
        function addScriptTag(src) {
            var script = document.createElement('script');
            script.setAttribute("type", "text/javascript");
            script.src = src;
            document.body.appendChild(script);
        }

        // 添加 highlight.js 库用于代码高亮
        function addHighlightJS() {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css';
            document.head.appendChild(link);
            
            var script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js';
            script.onload = function() {
                if (typeof hljs !== 'undefined') {
                    hljs.highlightAll();
                }
            };
            document.body.appendChild(script);
        }

        window.onload = function () {
            // 添加 marked.js
            // addScriptTag('https://cdn.jsdelivr.net/npm/marked@17.0.1/lib/marked.umd.min.js');
            
            // 添加 highlight.js
            // addHighlightJS();
            
            // 等待 marked.js 加载完成
            var checkMarked = setInterval(function() {
                if (typeof marked !== 'undefined') {
                    clearInterval(checkMarked);
                    initApp();
                }
            }, 100);
        };

        function initApp() {
            var editor = document.getElementById('editor');
            var preview = document.getElementById('preview');
            var convertBtn = document.getElementById('convert-btn');
            var clearBtn = document.getElementById('clear-btn');
            
            // 配置 marked.js
            marked.setOptions({
                breaks: true,
                gfm: true,
                highlight: function(code, lang) {
                    if (lang && typeof hljs !== 'undefined') {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (e) {
                            return hljs.highlightAuto(code).value;
                        }
                    }
                    return code;
                }
            });
            
            // 初始转换
            updatePreview();
            
            // 输入时实时更新预览
            editor.addEventListener('input', updatePreview);
            
            // 转换按钮点击事件
            convertBtn.addEventListener('click', updatePreview);
            
            // 清空按钮点击事件
            clearBtn.addEventListener('click', function() {
                editor.value = '';
                updatePreview();
            });
            
            function updatePreview() {
                var markdownText = editor.value;
                var htmlContent = marked.parse(markdownText);
                preview.innerHTML = htmlContent;
                
                // 重新高亮代码块
                if (typeof hljs !== 'undefined') {
                    hljs.highlightAll();
                }
            }
        }
    </script>
</body>
</html>
